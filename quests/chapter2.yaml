# Linux Lab — AGDR Tutorial Chapter 2 「Linux终端操作」
# Student environment: Ubuntu 24.04
# v0.2.0: init scripts + short_answer + bonus + outline rewrite
version: 1
title: "Linux 终端操作实操测验（第二章）"
workspace_prefix: "/tmp/linux-lab"
questions:
  - id: Q01-paths-files
    title: "路径与文件操作"
    section: "01 路径与文件"
    needs_sudo: false
    instructions: |
      工作区已为空目录（$LINUX_LAB_WORKSPACE）。请完成：

      1. 创建目录树：practice/docs 与 practice/bin
      2. 在 practice/docs 下创建空文件 readme.txt
      3. 在 practice/bin 下创建空文件 tool.sh
      4. 将 practice/docs/readme.txt 复制为 practice/docs/readme.bak
      5. 将 practice/bin/tool.sh 移动（改名）为 practice/bin/helper.sh
      6. 删除 practice/docs/readme.txt（保留 .bak）

      提示：mkdir -p、touch、cp、mv、rm。
      完成后按 Ctrl+G 判题。
    graders:
      - type: file
        path: practice/docs
        is_dir: true
      - type: file
        path: practice/bin
        is_dir: true
      - type: file
        path: practice/docs/readme.bak
        exists: true
      - type: file
        path: practice/bin/helper.sh
        exists: true
      - type: file
        path: practice/docs/readme.txt
        exists: false
      - type: file
        path: practice/bin/tool.sh
        exists: false
      - type: command_regex
        pattern: '(?i)\b(cp|mv|rm)\b'
        description: "曾使用过 cp/mv/rm 之一"

  - id: Q02-view-search
    title: "查看与搜索文本"
    section: "02 查看与管道"
    needs_sudo: false
    init: |
      mkdir -p workspace
    instructions: |
      环境已创建 workspace/ 目录。

      1. 创建文件 workspace/app.log，写入至少三行，其中一行包含 ERROR
      2. 用 grep 把含 ERROR 的行写入 workspace/errors.txt

      示例：
        echo 'INFO ok' > workspace/app.log
        echo 'ERROR boom' >> workspace/app.log
        echo 'INFO done' >> workspace/app.log
        grep ERROR workspace/app.log > workspace/errors.txt
    graders:
      - type: file
        path: workspace/app.log
        exists: true
        content_regex: '(?m)ERROR'
      - type: file
        path: workspace/errors.txt
        exists: true
        content_regex: '(?m)ERROR'
      - type: command_regex
        pattern: '(?i)\bgrep\b.*ERROR'
        description: "曾执行含 ERROR 的 grep"

  - id: Q03-pipes-redirect
    title: "管道与重定向"
    section: "02 查看与管道"
    needs_sudo: false
    init: |
      mkdir -p data
    instructions: |
      环境已创建 data/ 目录。

      1. 生成文件 data/numbers.txt，内容为多行数字或单词（至少 5 行）
      2. 用管道统计行数，结果写入 data/count.txt（文件中有一个整数即可）
         例如：cat data/numbers.txt | wc -l > data/count.txt
    graders:
      - type: file
        path: data/numbers.txt
        exists: true
        content_regex: '(?s).+\n.+\n'
      - type: file
        path: data/count.txt
        exists: true
        content_regex: '\d+'
      - type: command_regex
        pattern: '(?i)(wc\s+-l|\|\s*wc)'
        description: "曾使用 wc -l 或管道到 wc"

  - id: Q04-permissions-chmod
    title: "权限与 chmod（含 -R）"
    section: "03 权限与属主"
    needs_sudo: false
    init: |
      mkdir -p scripts perms/tree/sub
      echo 'note' > perms/note.txt
      echo 'leaf' > perms/tree/sub/leaf.txt
      chmod 600 perms/note.txt
      chmod 600 perms/tree/sub/leaf.txt
    instructions: |
      环境已准备 scripts/、perms/note.txt 与 perms/tree/（含子文件，当前偏严权限）。

      1. 创建脚本 scripts/hello.sh（建议 #!/bin/bash），内容能 echo 出 hi 或 Hello
      2. 赋予所有者读写执行：chmod 700 scripts/hello.sh
      3. 使用符号模式给 perms/note.txt 所有人读权限，例如：chmod a+r perms/note.txt
      4. 使用 chmod -R 递归修改 perms/tree，使 others 至少可读，例如：
           chmod -R a+rX perms/tree
         或 chmod -R o+r perms/tree
    graders:
      - type: file
        path: scripts/hello.sh
        exists: true
        content_regex: '(?i)echo.*hi|echo.*hello'
        mode_octal: "0700"
      - type: command_regex
        pattern: '(?i)chmod\s+(700|u\+x|u\+rwx).*hello\.sh|chmod\s+.*hello\.sh'
        description: "曾对 hello.sh 使用 chmod"
      - type: command_regex
        pattern: '(?i)chmod\s+(a\+[rx]|ugo\+[rx]|o\+r|a\+r)\b'
        description: "使用符号模式 chmod（如 a+r）"
      - type: command_regex
        pattern: '(?i)chmod\s+-R\b'
        description: "使用过 chmod -R"
      - type: output
        command: "stat -c '%a' perms/note.txt"
        cwd_workspace: true
        stdout_regex: '(?m)^[0-7][0-7][4567]$'
        description: "note.txt others 可读"
      - type: output
        command: "stat -c '%a' perms/tree/sub/leaf.txt"
        cwd_workspace: true
        stdout_regex: '(?m)^[0-7][0-7][4567]$'
        description: "递归后 leaf.txt others 可读"

  - id: Q05-chown-chgrp
    title: "属主与属组 chown/chgrp"
    section: "03 权限与属主"
    needs_sudo: false
    init: |
      mkdir -p owner
      echo 'sample' > owner/sample.txt
    instructions: |
      环境已创建 owner/sample.txt。

      在学生机上通常没有其它用户可随意 chown，本关练习语法，改回当前用户/组即可：

        chown "$(whoami)" owner/sample.txt
        chgrp "$(id -gn)" owner/sample.txt

      也可用：chown "$(whoami):$(id -gn)" owner/sample.txt

      用 stat 查看：stat -c '%U %G' owner/sample.txt
    graders:
      - type: command_regex
        pattern: '(?i)\bchown\b'
        description: "使用过 chown"
      - type: command_regex
        pattern: '(?i)\bchgrp\b|chown\s+\S+:\S+'
        description: "使用过 chgrp 或 chown user:group"
      - type: output
        command: "stat -c '%U %G' owner/sample.txt"
        cwd_workspace: true
        stdout_regex: '.+'
        description: "sample.txt 可读取属主属组"

  - id: Q06-setfacl
    title: "ACL：setfacl -m"
    section: "03 权限与属主"
    bonus: true
    needs_sudo: false
    init: |
      mkdir -p acl
      echo 'acl-data' > acl/data.txt
    instructions: |
      【附加题】环境已创建 acl/data.txt。

      1. （可选）若无 getfacl/setfacl：sudo apt install -y acl
      2. 给当前用户增加读写 ACL，例如：
           setfacl -m "u:$(whoami):rw" acl/data.txt
      3. 用 getfacl acl/data.txt 查看

      判题检查命令历史中的 setfacl -m，并尽量用 getfacl 输出校验。
    graders:
      - type: command_regex
        pattern: '(?i)setfacl\s+-m\b'
        description: "使用过 setfacl -m"
      - type: output
        command: "getfacl -p acl/data.txt 2>/dev/null | grep -E 'user:.+:rw' || (command -v getfacl >/dev/null && getfacl -p acl/data.txt) || echo 'ACL_TOOL_MISSING'"
        cwd_workspace: true
        stdout_regex: '(?i)user:.+:rw|ACL_TOOL_MISSING'
        description: "getfacl 显示用户 ACL，或本机未装 acl 工具"

  - id: Q07-env-path
    title: "环境变量与 PATH"
    section: "04 环境与进程"
    needs_sudo: false
    init: |
      mkdir -p env
    instructions: |
      环境已创建 env/ 目录。

      1. 执行 echo $PATH （或 echo "$PATH"）
      2. 设置自定义变量并写入文件：
           export LAB_OK=1
           echo "$LAB_OK" > env/myvar.txt
    graders:
      - type: command_regex
        pattern: '(?i)echo\s+\$\{?PATH\}?'
        description: "查看过 PATH"
      - type: file
        path: env/myvar.txt
        exists: true
        content_regex: '1'

  - id: Q08-processes
    title: "进程查看（htop/PID）"
    section: "04 环境与进程"
    needs_sudo: false
    init: |
      mkdir -p proc .lab
      # idempotent: reuse live helper if present
      if [ -f .lab/q08.pid ] && kill -0 "$(cat .lab/q08.pid)" 2>/dev/null; then
        exit 0
      fi
      # setsid so bash -lc (grader) does not wait on the helper
      setsid bash -c 'exec -a lab-test-proc sleep 3600' </dev/null >/dev/null 2>&1 &
      echo $! > .lab/q08.pid
    instructions: |
      环境已在后台启动测试进程，进程名约为 lab-test-proc（实为 sleep）。
      真实 PID 已写入隐藏文件供判题比对（不要直接抄隐藏文件）。

      1. 用 htop、ps 或 pgrep 查找 lab-test-proc（或 sleep）的 PID
         例如：pgrep -f lab-test-proc
         或在 htop 中搜索 lab-test-proc（F3）
      2. 将找到的 PID 写入 proc/pid.txt（仅数字，可带换行）

      完成后 Ctrl+G。
    graders:
      - type: command_regex
        pattern: '(?i)\b(htop|ps|pgrep)\b'
        description: "使用过 htop/ps/pgrep"
      - type: file
        path: proc/pid.txt
        exists: true
        content_regex: '^\s*\d+\s*$'
      - type: output
        command: |
          student=$(tr -d ' \t\r\n' < proc/pid.txt)
          expect=$(tr -d ' \t\r\n' < .lab/q08.pid)
          if [ -n "$student" ] && [ "$student" = "$expect" ]; then echo PID_OK; else echo "PID_MISMATCH student=$student expect=$expect"; fi
        cwd_workspace: true
        stdout_regex: 'PID_OK'
        description: "proc/pid.txt 与测试进程 PID 一致"

  - id: Q09-tar
    title: "打包归档 tar"
    section: "05 归档与软件包"
    needs_sudo: false
    init: |
      mkdir -p archive/src
      echo 'alpha' > archive/src/a.txt
      echo 'beta' > archive/src/b.txt
    instructions: |
      环境已准备 archive/src/（含 a.txt、b.txt）。

      创建 gzip 归档：archive/backup.tar.gz
      例如：tar -czf archive/backup.tar.gz -C archive src
    graders:
      - type: file
        path: archive/backup.tar.gz
        exists: true
      - type: command_regex
        pattern: '(?i)\btar\b.*\b(czf|czvf|-czf|-c.*-z.*-f)'
        description: "使用 tar 创建过 gzip 归档"
      - type: output
        command: "tar -tzf archive/backup.tar.gz"
        cwd_workspace: true
        stdout_regex: '.+'
        description: "归档可列出内容"

  - id: Q10-apt-search
    title: "apt 软件包查询"
    section: "05 归档与软件包"
    needs_sudo: false
    init: |
      mkdir -p packages
    instructions: |
      查询 curl 包信息（不需要安装）：
        apt-cache show curl
      或
        apt show curl

      然后将包名写入 packages/curl-name.txt（内容为 curl 即可）。
    graders:
      - type: command_regex
        pattern: '(?i)apt(-cache)?\s+(show|search|policy).*curl|apt\s+show\s+curl'
        description: "用 apt/apt-cache 查询过 curl"
      - type: file
        path: packages/curl-name.txt
        exists: true
        content_regex: '(?i)curl'

  - id: Q11-openssh-server
    title: "安装 openssh-server"
    section: "05 归档与软件包"
    needs_sudo: true
    instructions: |
      【需要 sudo】在 Ubuntu 24.04 学生机上安装 OpenSSH 服务端：

        sudo apt-get update
        sudo apt-get install -y openssh-server
      或：
        sudo apt install -y openssh-server

      可用 dpkg -l openssh-server 确认。
      开发/CI 无 sudo 时本关 FAIL 属预期。
    graders:
      - type: command_regex
        pattern: '(?i)sudo\s+apt(-get)?\s+install\s+.*openssh-server'
        description: "执行过 sudo apt install openssh-server"
      - type: output
        command: "dpkg -l openssh-server"
        cwd_workspace: false
        stdout_regex: '(?m)^ii\s+openssh-server'
        description: "dpkg 显示 openssh-server 已安装 (ii)"

  - id: Q12-systemctl-ssh
    title: "systemctl 管理 ssh.service"
    section: "06 服务与远程"
    needs_sudo: true
    init: |
      mkdir -p service
    instructions: |
      【需要 sudo】假设已安装 openssh-server。练习 systemctl（服务名多为 ssh）：

      1. 查看状态：systemctl status ssh   或  systemctl status ssh.service
      2. 设置开机自启：sudo systemctl enable ssh
      3. 停止：sudo systemctl stop ssh
      4. 再启动：sudo systemctl start ssh
      5. 确认：systemctl is-active ssh

      可将 is-active 结果写入 service/ssh-state.txt（可选）。
      判题要求历史中出现 enable/start/stop/status（或 is-active），且当前服务 active。
    graders:
      - type: command_regex
        pattern: '(?i)systemctl\s+(status|is-active)\s+ssh(\.service)?'
        description: "查询过 ssh 状态"
      - type: command_regex
        pattern: '(?i)systemctl\s+enable\s+ssh(\.service)?'
        description: "执行过 systemctl enable ssh"
      - type: command_regex
        pattern: '(?i)systemctl\s+stop\s+ssh(\.service)?'
        description: "执行过 systemctl stop ssh"
      - type: command_regex
        pattern: '(?i)systemctl\s+start\s+ssh(\.service)?'
        description: "执行过 systemctl start ssh"
      - type: output
        command: "systemctl is-active ssh || systemctl is-active ssh.service || systemctl is-active sshd"
        cwd_workspace: false
        stdout_regex: '(?i)active'
        description: "ssh 服务最终为 active"

  - id: Q13-scp
    title: "scp 本地拷贝"
    section: "06 服务与远程"
    needs_sudo: false
    init: |
      mkdir -p scp-lab/src scp-lab/dst
      echo 'hello-scp' > scp-lab/src/hello.txt
      rm -f scp-lab/dst/hello.txt
    instructions: |
      环境已创建 scp-lab/src/hello.txt，目标目录 scp-lab/dst/ 为空。

      使用 scp 将源文件拷到目标目录（本机路径互拷，无需密码），例如：
        scp scp-lab/src/hello.txt scp-lab/dst/

      判题检查 dst 下文件存在，且命令历史含 scp。
    graders:
      - type: command_regex
        pattern: '(?i)\bscp\b'
        description: "使用过 scp"
      - type: file
        path: scp-lab/dst/hello.txt
        exists: true
        content_regex: 'hello-scp'

  - id: Q14-du-hs
    title: "du -hs 查看目录大小"
    section: "07 磁盘与占用"
    needs_sudo: false
    answer_prompt: "请输入 du -hs bigdir 输出的第一列大小（如 2.0M）"
    init: |
      mkdir -p bigdir
      # ~2MiB payload (init 允许 dd；学生 shell 仍拦截 dd)
      dd if=/dev/zero of=bigdir/blob.bin bs=1M count=2 status=none
      sync
    instructions: |
      环境已创建目录 bigdir/（内含约 2MiB 数据）。

      1. 运行：du -hs bigdir
      2. 将输出第一列大小（如 2.0M）用 a / Ctrl+A 提交为简答

      注意：不同文件系统显示可能为 2.0M / 2.1M 等，以你本机 du 输出为准。
    graders:
      - type: command_regex
        pattern: '(?i)du\s+-hs\b'
        description: "执行过 du -hs"
      - type: short_answer
        expect_command: "du -hs bigdir | awk '{print $1}'"
        normalize: trim
        description: "目录大小第一列"

  - id: Q15-df-h
    title: "df -h 查看分区"
    section: "07 磁盘与占用"
    needs_sudo: false
    answer_prompt: "请输入 df -h / 数据行的 Use%（如 42%）"
    init: |
      mkdir -p disk
    instructions: |
      1. 运行：df -h
      2. 查看根分区 / 的 Use%（已用百分比，含 % 号）
      3. 用 a / Ctrl+A 提交该 Use%（例如 37%）

      也可先：df -h / 再看第二行第 5 列。
    graders:
      - type: command_regex
        pattern: '(?i)\bdf\s+-h\b'
        description: "执行过 df -h"
      - type: short_answer
        expect_command: "df -h / | awk 'NR==2{print $5}'"
        normalize: trim
        description: "根分区 Use%"

  - id: Q16-lsof
    title: "lsof 查看文件占用"
    section: "07 磁盘与占用"
    needs_sudo: false
    init: |
      mkdir -p lsof-lab .lab
      echo 'held-open' > lsof-lab/held.txt
      if [ -f .lab/q16.pid ] && kill -0 "$(cat .lab/q16.pid)" 2>/dev/null; then
        exit 0
      fi
      # keep held.txt open; setsid so init bash does not wait
      setsid bash -c 'exec 3<lsof-lab/held.txt; exec -a lab-lsof-holder sleep 3600' </dev/null >/dev/null 2>&1 &
      echo $! > .lab/q16.pid
    instructions: |
      环境已打开文件 lsof-lab/held.txt，并由后台进程 lab-lsof-holder 占用。

      1. 用 lsof 查找谁占用了该文件，例如：
           lsof lsof-lab/held.txt
         或：lsof | grep held.txt
      2. 将占用进程的 PID 写入 lsof-lab/holder-pid.txt

      （若提示未安装：sudo apt install -y lsof）
    graders:
      - type: command_regex
        pattern: '(?i)\blsof\b'
        description: "使用过 lsof"
      - type: file
        path: lsof-lab/holder-pid.txt
        exists: true
        content_regex: '^\s*\d+\s*$'
      - type: output
        command: |
          student=$(tr -d ' \t\r\n' < lsof-lab/holder-pid.txt)
          expect=$(tr -d ' \t\r\n' < .lab/q16.pid)
          if [ -n "$student" ] && [ "$student" = "$expect" ]; then echo LSOF_OK; else echo "LSOF_MISMATCH student=$student expect=$expect"; fi
        cwd_workspace: true
        stdout_regex: 'LSOF_OK'
        description: "holder-pid.txt 与占用进程 PID 一致"

  - id: Q17-find
    title: "综合：find 与整理"
    section: "08 综合"
    needs_sudo: false
    init: |
      mkdir -p find samples
      echo 'one' > samples/one.txt
      echo 'two' > samples/two.txt
      echo 'note' > samples/note.md
    instructions: |
      环境已在 samples/ 下放置若干文件（含 .txt）。

      1. 用 find 查找工作区内所有 .txt 文件，列表写入 find/txt-list.txt
         例如：find . -name '*.txt' > find/txt-list.txt
      2. 确保 find/txt-list.txt 非空且含 .txt
    graders:
      - type: command_regex
        pattern: '(?i)\bfind\b.*\.txt|find\b.*-name'
        description: "使用过 find"
      - type: file
        path: find/txt-list.txt
        exists: true
        content_regex: '\.txt'
