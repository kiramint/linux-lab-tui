# Linux Lab — AGDR Tutorial Chapter 2 「Linux终端操作」
# Student environment: Ubuntu 24.04
version: 1
title: "Linux 终端操作实操测验（第二章）"
workspace_prefix: "/tmp/linux-lab"
questions:
  - id: Q01-paths
    title: "路径与目录创建"
    section: "01 路径与文件系统"
    needs_sudo: false
    instructions: |
      在工作区（$LINUX_LAB_WORKSPACE，当前 shell 已 cd 到此）完成：

      1. 创建目录树：practice/docs 与 practice/bin
      2. 在 practice/docs 下创建空文件 readme.txt
      3. 在 practice/bin 下创建空文件 tool.sh

      提示：mkdir -p、touch、相对路径。
      完成后按 Ctrl+G 判题（或焦点在左侧时按 Enter）。
    graders:
      - type: file
        path: practice/docs/readme.txt
        exists: true
      - type: file
        path: practice/bin/tool.sh
        exists: true
      - type: file
        path: practice/docs
        is_dir: true
      - type: file
        path: practice/bin
        is_dir: true

  - id: Q02-file-ops
    title: "文件复制、移动与删除"
    section: "02 文件与目录操作"
    needs_sudo: false
    instructions: |
      承接上一题的目录（若没有请先建好）：

      1. 将 practice/docs/readme.txt 复制为 practice/docs/readme.bak
      2. 将 practice/bin/tool.sh 移动（改名）为 practice/bin/helper.sh
      3. 删除 practice/docs/readme.txt（保留 .bak）

      可用 cp、mv、rm。
    graders:
      - type: file
        path: practice/docs/readme.bak
        exists: true
      - type: file
        path: practice/bin/helper.sh
        exists: true
      - type: file
        path: practice/docs/readme.txt
        exists: false
      - type: file
        path: practice/bin/tool.sh
        exists: false
      - type: command_regex
        pattern: '(?i)\b(cp|mv|rm)\b'
        description: "曾使用过 cp/mv/rm 之一"

  - id: Q03-view-search
    title: "查看与搜索文本"
    section: "03 查看与搜索"
    needs_sudo: false
    instructions: |
      1. 创建文件 workspace/app.log，写入至少三行，其中一行包含 ERROR（可用 echo 重定向）
      2. 用 grep 把含 ERROR 的行写入 workspace/errors.txt

      示例思路：
        mkdir -p workspace
        echo 'INFO ok' > workspace/app.log
        echo 'ERROR boom' >> workspace/app.log
        grep ERROR workspace/app.log > workspace/errors.txt
    graders:
      - type: file
        path: workspace/app.log
        exists: true
        content_regex: '(?m)ERROR'
      - type: file
        path: workspace/errors.txt
        exists: true
        content_regex: '(?m)ERROR'
      - type: command_regex
        pattern: '(?i)\bgrep\b.*ERROR'
        description: "曾执行含 ERROR 的 grep"

  - id: Q04-pipes-redirect
    title: "管道与重定向"
    section: "04 管道与重定向"
    needs_sudo: false
    instructions: |
      1. 生成文件 data/numbers.txt，内容为多行数字或单词（至少 5 行）
      2. 用管道统计行数，结果写入 data/count.txt（只要文件中有一个整数即可）
         例如：wc -l < data/numbers.txt > data/count.txt
         或：cat data/numbers.txt | wc -l > data/count.txt
    graders:
      - type: file
        path: data/numbers.txt
        exists: true
        content_regex: '(?s).+\n.+\n'
      - type: file
        path: data/count.txt
        exists: true
        content_regex: '\d+'
      - type: command_regex
        pattern: '(?i)(wc\s+-l|\|\s*wc)'
        description: "曾使用 wc -l 或管道到 wc"

  - id: Q05-permissions
    title: "权限与可执行脚本"
    section: "05 用户与权限"
    needs_sudo: false
    instructions: |
      1. 创建脚本 scripts/hello.sh，内容第一行最好是 #!/bin/bash，且能 echo 出 hi（或 Hello）
      2. 赋予所有者读写执行权限：chmod 700 scripts/hello.sh
      3. （可选）运行 ./scripts/hello.sh 验证

      判题会检查文件模式是否为 0700（或至少 owner 可执行）。
    graders:
      - type: file
        path: scripts/hello.sh
        exists: true
        content_regex: '(?i)echo.*hi|echo.*hello'
        mode_octal: "0700"
      - type: command_regex
        pattern: '(?i)chmod\s+(700|u\+x|u\+rwx).*hello\.sh|chmod\s+.*hello\.sh'
        description: "曾对 hello.sh 使用 chmod"

  - id: Q06-chmod-symbolic
    title: "符号模式 chmod"
    section: "05 用户与权限"
    needs_sudo: false
    instructions: |
      1. 创建文件 perms/note.txt（任意内容）
      2. 使用符号模式赋予所有人读权限，例如：chmod a+r perms/note.txt
         或 chmod ugo+r perms/note.txt

      判题检查命令历史中的符号 chmod，以及文件对 others 至少可读。
    graders:
      - type: file
        path: perms/note.txt
        exists: true
      - type: command_regex
        pattern: '(?i)chmod\s+(a\+[rx]|ugo\+[rx]|o\+r|a\+r)\b'
        description: "使用符号模式 chmod（如 a+r）"
      - type: output
        command: "stat -c '%a' perms/note.txt"
        cwd_workspace: true
        stdout_regex: '(?m)^[0-7][0-7][4567]$'
        description: "others 具有读权限（mode 末位为 4-7）"

  - id: Q07-whoami
    title: "当前用户身份"
    section: "05 用户与权限"
    needs_sudo: false
    instructions: |
      在右侧 shell 中执行：
        whoami
        id

      用于确认当前用户与组信息。无需改文件。
    graders:
      - type: command_regex
        pattern: '(?m)^\s*whoami\s*$'
        description: "执行过 whoami"
      - type: command_regex
        pattern: '(?m)^\s*id\s*$'
        description: "执行过 id"

  - id: Q08-env-path
    title: "环境变量与 PATH"
    section: "06 环境变量"
    needs_sudo: false
    instructions: |
      1. 执行 echo $PATH （或 echo "$PATH"）
      2. 在工作区创建文件 env/myvar.txt，写入你自定义变量 LAB_OK 的值：
         export LAB_OK=1
         echo "$LAB_OK" > env/myvar.txt
    graders:
      - type: command_regex
        pattern: '(?i)echo\s+\$\{?PATH\}?'
        description: "查看过 PATH"
      - type: file
        path: env/myvar.txt
        exists: true
        content_regex: '1'

  - id: Q09-processes
    title: "进程查看"
    section: "07 进程管理入门"
    needs_sudo: false
    instructions: |
      执行下列命令之一组即可：
        ps aux | head
      或
        ps -ef | head

      再执行：
        echo done > proc/ps-ok.txt
    graders:
      - type: command_regex
        pattern: '(?i)\bps\b'
        description: "执行过 ps"
      - type: file
        path: proc/ps-ok.txt
        exists: true
        content_regex: 'done'

  - id: Q10-tar
    title: "打包归档 tar"
    section: "08 压缩与归档"
    needs_sudo: false
    instructions: |
      1. 准备目录 archive/src，内含至少一个文件（如 a.txt）
      2. 在工作区创建归档：archive/backup.tar.gz
         例如：tar -czf archive/backup.tar.gz -C archive src
    graders:
      - type: file
        path: archive/backup.tar.gz
        exists: true
      - type: command_regex
        pattern: '(?i)\btar\b.*\b(czf|czvf|-czf|-c.*-z.*-f)'
        description: "使用 tar 创建过 gzip 归档"
      - type: output
        command: "tar -tzf archive/backup.tar.gz"
        cwd_workspace: true
        stdout_regex: '.+'
        description: "归档可列出内容"

  - id: Q11-apt-search
    title: "apt 软件包查询"
    section: "09 软件包管理"
    needs_sudo: false
    instructions: |
      查询 curl 包信息（不需要安装）：
        apt-cache show curl
      或
        apt show curl

      然后将包名写入 packages/curl-name.txt（内容为 curl 即可）。
    graders:
      - type: command_regex
        pattern: '(?i)apt(-cache)?\s+(show|search|policy).*curl|apt\s+show\s+curl'
        description: "用 apt/apt-cache 查询过 curl"
      - type: file
        path: packages/curl-name.txt
        exists: true
        content_regex: '(?i)curl'

  - id: Q12-openssh-server
    title: "安装 openssh-server（需 sudo）"
    section: "09 软件包管理 / 远程连接"
    needs_sudo: true
    instructions: |
      【需要 sudo】本关在真实 Ubuntu 24.04 学生机上完成，用于后续 SSH 远程。

      1. 安装：
           sudo apt-get update
           sudo apt-get install -y openssh-server
         或：
           sudo apt install -y openssh-server

      2. 确认服务（名称可能是 ssh 或 sshd）：
           systemctl is-active ssh
         或：
           systemctl status ssh

      3. 也可用 dpkg 确认：
           dpkg -l openssh-server

      判题：命令历史须匹配 apt 安装；并用 dpkg/systemctl 输出校验。
      注意：开发/CI 环境若无 sudo 或未装成功，本关会 FAIL，属预期。
    graders:
      - type: command_regex
        pattern: '(?i)sudo\s+apt(-get)?\s+install\s+.*openssh-server'
        description: "执行过 sudo apt install openssh-server"
      - type: output
        command: "dpkg -l openssh-server"
        cwd_workspace: false
        stdout_regex: '(?m)^ii\s+openssh-server'
        description: "dpkg 显示 openssh-server 已安装 (ii)"

  - id: Q13-ssh-service
    title: "检查 SSH 服务状态"
    section: "09 远程连接"
    needs_sudo: false
    instructions: |
      在已安装 openssh-server 的前提下：

        systemctl is-active ssh
      或
        systemctl is-active sshd

      将输出重定向保存：
        systemctl is-active ssh > service/ssh-state.txt 2>&1
      （若服务名是 sshd，用 sshd 亦可）

      文件内容期望包含 active（或 activating 等，判题主要看你执行过 systemctl）。
    graders:
      - type: command_regex
        pattern: '(?i)systemctl\s+(is-active|status)\s+ssh(d)?'
        description: "查询过 ssh/sshd 服务状态"
      - type: file
        path: service/ssh-state.txt
        exists: true
      - type: output
        command: "systemctl is-active ssh || systemctl is-active sshd"
        cwd_workspace: false
        stdout_regex: '(?i)active'
        description: "ssh 服务处于 active（需本机已安装并启动）"

  - id: Q14-find-basic
    title: "综合：find 与整理"
    section: "综合"
    needs_sudo: false
    instructions: |
      1. 在工作区用 find 查找所有 .txt 文件，列表写入 find/txt-list.txt
         例如：find . -name '*.txt' > find/txt-list.txt
      2. 确保 find/txt-list.txt 非空（前面关卡应已产生若干 .txt）
    graders:
      - type: command_regex
        pattern: '(?i)\bfind\b.*\.txt|find\b.*-name'
        description: "使用过 find"
      - type: file
        path: find/txt-list.txt
        exists: true
        content_regex: '\.txt'
